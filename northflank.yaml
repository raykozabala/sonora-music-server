services:
  - type: web
    name: sonora-music-server
    env: docker
    dockerfile: ./Dockerfile
    rootDir: ./
    envVars:
      - key: PORT
        value: 3000
      - key: SERVER_MODE
        value: northflank
      - key: SERVER_URL
        sync: false
      - key: NORTHFLANK_URL
        value: https://api.northflank.com
      - key: API_TOKEN
        value: nf-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..BC3qvwrrLT3eySEIzCT81KuOwQIeoKU47M1nKHGrxmc
    healthCheckPath: /api/health
    autoDeploy: true
